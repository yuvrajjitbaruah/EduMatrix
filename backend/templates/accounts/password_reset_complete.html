{% extends "base.html" %}
{% block title %}Password Updated{% endblock %}
{% block body %}
<div class="mesh-bg"><div class="mesh-blob mesh-blob-1"></div><div class="mesh-blob mesh-blob-2"></div><div class="mesh-blob mesh-blob-3"></div></div>
<div class="login-page">
    <div class="login-showcase">
        <h1 class="login-showcase-title">Password<br><span class="gradient-text">Updated</span></h1>
        <p class="login-showcase-subtitle">Your EduMatrix account is ready with the new password.</p>
    </div>
    <div class="login-form-side">
        <div class="login-form-card glass-strong" style="text-align:center;">
            <h2 class="login-form-title">You are all set</h2>
            <p class="login-form-desc">Sign in with your updated password.</p>
            <a href="{% url 'login' %}" class="btn btn-primary btn-lg btn-full">Sign In</a>
        </div>
    </div>
</div>
{% endblock %}
