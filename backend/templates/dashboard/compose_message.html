{% extends "dashboard/layout.html" %}
{% block title %}Compose Message{% endblock %}

{% block content %}
<div class="space-y-6">
    <div>
        <a href="{% url 'inbox' %}" style="font-size: 0.875rem; color: var(--indigo-500); font-weight: 600;">← Back to Inbox</a>
        <h1 class="page-title" style="margin-top: 0.5rem;">Compose Message ✍️</h1>
    </div>

    <div class="card fade-in">
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">To</label>
                <select name="receiver_id" class="form-input" required>
                    <option value="">Select Recipient</option>
                    {% for u in users %}
                    <option value="{{ u.id }}" {% if prefill.receiver_id == u.id %}selected{% endif %}>{{ u.get_full_name|default:u.username }} ({{ u.role|upper }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Subject</label>
                <input type="text" name="subject" class="form-input" placeholder="Message subject" value="{{ prefill.subject|default:'' }}" required>
            </div>
            <div class="form-group">
                <label class="form-label">Message</label>
                <textarea name="body" class="form-input" rows="8" placeholder="Write your message..." required></textarea>
            </div>
            <div class="flex items-center gap-3">
                <button type="submit" class="btn btn-primary">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                    Send Message
                </button>
                <a href="{% url 'inbox' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
