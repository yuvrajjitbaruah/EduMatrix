{% extends "base.html" %}
{% load static %}
{% block title %}Offline{% endblock %}
{% block body %}
<div class="mesh-bg"><div class="mesh-blob mesh-blob-1"></div><div class="mesh-blob mesh-blob-2"></div><div class="mesh-blob mesh-blob-3"></div></div>
<main class="landing-shell" style="min-height:100vh;display:grid;place-items:center;padding:2rem;">
    <section class="landing-nav glass-strong" style="max-width:680px;width:100%;padding:2rem;text-align:center;">
        <img src="{% static 'img/edumatrix-logo-transparent.png' %}" alt="EduMatrix" style="height:64px;width:auto;margin-bottom:1rem;">
        <h1 style="font-size:clamp(2rem,6vw,4rem);line-height:1;margin:0 0 1rem;">You are offline</h1>
        <p style="color:var(--text-muted);font-size:1.05rem;line-height:1.7;margin:0 auto 1.5rem;max-width:520px;">EduMatrix is installed and ready, but this page needs a network connection. Reconnect and try again.</p>
        <a href="/" class="btn btn-primary btn-lg">Go Home</a>
    </section>
</main>
{% endblock %}
